name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Biome compares against the base branch

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (files changed in this PR)
        if: github.event_name == 'pull_request'
        run: pnpm exec biome ci --changed --since=origin/${{ github.base_ref }} --no-errors-on-unmatched

      - run: pnpm typecheck

      - run: pnpm build
